<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You, Liza</title>
<link rel="icon" type="image/png" href="liza.jpg">
<style>
  :root{
    --bg: #0a0508;
    --rose: #ff5c8a;
    --rose-deep: #ff2d6a;
    --gold: #ffd27a;
  }
  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at center, #1a0510 0%, var(--bg) 70%);
    overflow:hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  .stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; align-items:center; justify-content:center;
    perspective: 1200px;
  }

  /* floating title */
  .title{
    position:absolute;
    top: 8%;
    left:50%;
    transform: translateX(-50%);
    text-align:center;
    color: var(--gold);
    letter-spacing: 2px;
    z-index: 5;
    opacity: 0;
    animation: fadeIn 2s ease forwards 0.4s;
  }
  .title h1{
    margin:0;
    font-size: clamp(22px, 4vw, 38px);
    font-weight: 400;
    text-shadow: 0 0 18px rgba(255,92,138,0.6);
  }
  .title p{
    margin: 6px 0 0;
    font-size: 13px;
    color: #d8a9b8;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  @keyframes fadeIn{ to { opacity:1; } }

  .heart-container{
    position:relative;
    width: 320px;
    height: 320px;
    transform-style: preserve-3d;
    animation: spin 14s linear infinite;
  }

  @keyframes spin{
    from{ transform: rotateY(0deg) rotateX(8deg); }
    to{ transform: rotateY(360deg) rotateX(8deg); }
  }

  .love{
    position:absolute;
    top:50%; left:50%;
    width:2px; height:2px;
    transform-style:preserve-3d;
  }

  .word{
    position:absolute;
    white-space:nowrap;
    font-size: 10px;
    font-weight:600;
    letter-spacing: 1px;
    color: transparent;
    background: linear-gradient(180deg, var(--gold) 0%, var(--rose) 55%, var(--rose-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 3px rgba(255,45,106,0.55));
    transform-origin: 0 0;
    user-select:none;
  }

  /* pulsing glow center */
  .glow{
    position:absolute;
    width: 60px; height: 60px;
    top:50%; left:50%;
    margin:-30px 0 0 -30px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,92,138,0.55) 0%, rgba(255,92,138,0) 70%);
    animation: pulse 2.6s ease-in-out infinite;
    z-index:0;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); opacity:0.6; }
    50%{ transform: scale(1.6); opacity:1; }
  }

  footer{
    position:absolute;
    bottom: 6%;
    left:50%;
    transform: translateX(-50%);
    color:#8a5568;
    font-size: 12px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0;
    animation: fadeIn 2s ease forwards 1.2s;
  }

  /* falling petals */
  .petal{
    position:absolute;
    top:-5%;
    font-size: 14px;
    color: var(--rose);
    opacity:0.7;
    animation: fall linear infinite;
    z-index:1;
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.8; }
    100%{ transform: translateY(110vh) rotate(360deg); opacity:0; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="title">
    <h1>I Love You, Liza</h1>
    <p>Every heartbeat spells your name</p>
  </div>

  <div class="glow"></div>
  <div class="heart-container" id="heart"></div>

  <footer>made with love for you dear<br>Laila Tuzzahan Liza</footer>
</div>

<script>
  const container = document.getElementById('heart');
  const TEXT = "I Love You Liza  ";
  const totalPoints = 140;

  // Parametric heart curve
  function heartPoint(t){
    // t from 0 to 2PI
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return { x, y };
  }

  const scale = 7.2;

  for(let i = 0; i < totalPoints; i++){
    const t = (i / totalPoints) * Math.PI * 2;
    const { x, y } = heartPoint(t);

    const depth = Math.sin(t * 3) * 14; // subtle 3D undulation

    const love = document.createElement('div');
    love.className = 'love';
    love.style.transform = `translate3d(${x*scale}px, ${y*scale}px, ${depth}px)`;

    const word = document.createElement('div');
    word.className = 'word';
    word.textContent = TEXT[i % TEXT.length] === ' ' ? '\u00A0' : TEXT;
    // Rotate each word slightly to trace the curve tangent
    const angle = (t * 180 / Math.PI) + 90;
    word.style.transform = `rotate(${angle}deg)`;
    word.style.fontSize = (9 + Math.random()*3) + 'px';

    love.appendChild(word);
    container.appendChild(love);
  }

  // Falling petals
  const stage = document.querySelector('.stage');
  const petalChars = ['♥','❀','✿'];
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petalChars[Math.floor(Math.random()*petalChars.length)];
    p.style.left = Math.random()*100 + '%';
    p.style.animationDuration = (6 + Math.random()*6) + 's';
    p.style.animationDelay = (Math.random()*8) + 's';
    p.style.fontSize = (10 + Math.random()*10) + 'px';
    stage.appendChild(p);
  }
</script>

</body>
</html>
